name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-compile:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
          rustup --version
      - name: Prepare pinned dependencies
        run: |
          scripts/bootstrap-video.sh
          scripts/bootstrap-fff.sh
      - name: Compile release executable
        run: swift build -c release --force-resolved-versions
