<!doctype html>
<!--
  Prototipo desechable: tres variantes del shell "Buscar y Leer" de Crawler, conmutables con ?variant=A|B|C
  y la barra inferior. Datos simulados; nada toca el disco y no forma parte de la app nativa.
  Ábrelo con doble clic o: open prototype/buscar-leer.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crawler · Buscar y leer</title>
<style>
:root {
  --is-dark: 0;
  --bg: #ffffff; --raised: #f8f8fb; --side: #f3f2f8; --text: #292b34; --muted: #6a7282; --line: #e5e7ed;
  --accent: #086cdc; --sel: #e5efff; --sel-text: #174d99; --sel-dim: #e9e9ef; --page-bg: #e8e8ed;
  --kw: #c2410c; --str: #15803d; --ty: #7c3aed;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --serif: "New York", "Iowan Old Style", Georgia, serif;
  --z: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --is-dark: 1;
    --bg: #202124; --raised: #292a2e; --side: #1b1c1f; --text: #ededf0; --muted: #a6a8b1; --line: #3a3b41;
    --accent: #80b6ff; --sel: #304564; --sel-text: #d5e7ff; --sel-dim: #303136; --page-bg: #151618;
    --kw: #fb923c; --str: #86efac; --ty: #c4b5fd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --is-dark: 1;
  --bg: #202124; --raised: #292a2e; --side: #1b1c1f; --text: #ededf0; --muted: #a6a8b1; --line: #3a3b41;
  --accent: #80b6ff; --sel: #304564; --sel-text: #d5e7ff; --sel-dim: #303136; --page-bg: #151618;
  --kw: #fb923c; --str: #86efac; --ty: #c4b5fd;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0 }
html.standalone body { background: var(--bg) }
:where(.frame) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: default; text-align: inherit }
:where(.frame) kbd { font: 10.5px/1 var(--ui); padding: 2px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--bg); white-space: nowrap }

.frame { height: var(--frame-h, 760px); display: flex; flex-direction: column; position: relative; overflow: hidden;
  background: var(--bg); color: var(--text); font: 13px/1.4 var(--ui); -webkit-font-smoothing: antialiased;
  border: 1px solid var(--line); border-radius: 12px }
html.standalone .frame { border: 0; border-radius: 0 }
#app { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative }

/* window chrome */
.lights { display: flex; gap: 8px; padding: 0 12px 0 14px; flex: none }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; display: block }
.lights i:nth-child(2) { background: #febc2e } .lights i:nth-child(3) { background: #28c840 }
.bar { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding-right: 10px; min-width: 0;
  background: var(--side); border-bottom: 1px solid var(--line); position: relative }
.bar:not(:has(.lights)) { padding-left: 8px }
.bar.flat { background: var(--bg); border-bottom-color: transparent; height: 40px }
.bar.light { background: var(--bg) }
.tb { height: 28px; min-width: 28px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); white-space: nowrap; flex: none }
.tb:hover { background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text) }
.tb.on { color: var(--accent) }
.sp { flex: 1 }
.rt { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; margin-left: 4px }
.rt b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.rt span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.zoom { display: inline-flex; align-items: center; flex: none }
.zoom span { font-size: 11.5px; color: var(--muted); min-width: 38px; text-align: center; font-variant-numeric: tabular-nums }
.pageind { font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; margin-right: 6px }
.prog { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); transition: width .08s linear }

/* search field */
.field { position: relative; display: flex; align-items: center; gap: 9px; height: 44px; width: min(720px, 100%); padding: 0 6px 0 14px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.04) }
.field:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent) }
.field.local { background: color-mix(in srgb, var(--accent) 7%, var(--bg)) }
.field > svg { flex: none; color: var(--muted) }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 19px var(--ui) }
.field input::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent) }
.field.sm { height: 34px; border-radius: 8px; padding-left: 10px; width: 100% }
.field.sm input { font-size: 14px }
.field.ovf { width: 100%; border: 0; box-shadow: none; padding-left: 6px }
.field.ovf input { font-size: 20px }
.scope { flex: none; max-width: 140px; font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.field.local .scope { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)) }
.menu { position: absolute; right: 4px; top: calc(100% + 6px); z-index: 20; min-width: 230px; padding: 5px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.16) }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; text-align: left; font-size: 13px }
.menu button:hover { background: var(--sel); color: var(--sel-text) }
.menu small { margin-left: auto; color: var(--muted); font-size: 11px }
.menu .cur { font-weight: 600 }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--bg) }
.chip:hover { color: var(--text) }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text) }

/* lists */
.list { flex: 1; min-height: 0; overflow: auto; padding: 4px 8px 12px; position: relative }
.lh { flex: none; display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 8px 16px 4px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden }
.crumbs button { color: var(--muted); padding: 1px 3px; border-radius: 4px }
.crumbs button:hover { color: var(--text); background: var(--sel-dim) }
.crumbs .last { color: var(--text); font-weight: 600 }
.qpill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--text) }
.qpill svg { width: 11px; height: 11px }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; min-width: 0 }
.row .t { flex: 1; min-width: 0 }
.row .n { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.row .p { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.row .m { flex: none; font-size: 11.5px; color: var(--muted); white-space: nowrap }
.row .chev { flex: none; color: var(--muted) }
.row.sel { background: var(--sel); color: var(--sel-text) }
.row.sel .p, .row.sel .m, .row.sel .chev { color: color-mix(in srgb, var(--sel-text) 70%, transparent) }
.list.dim .row.sel { background: var(--sel-dim); color: var(--text) }
.list.dim .row.sel .p, .list.dim .row.sel .m, .list.dim .row.sel .chev { color: var(--muted) }
.row mark { background: none; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 65%, transparent); text-underline-offset: 2px }
.compact .row { padding: 4px 8px; gap: 8px }
.compact .row .n { font-size: 13px }
.empty { padding: 20px 12px; color: var(--muted) }
.ico { flex: none; width: 22px; height: 26px; border-radius: 4px; display: grid; place-items: center; font: 700 8.5px/1 var(--ui); letter-spacing: .02em;
  color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 24%, transparent) }
.compact .ico, .tab .ico, .pal-row .ico { width: 17px; height: 20px; font-size: 7px }
.ico.dir { background: none; border: 0; color: #4a90e2 }
.k-md { --c: #2f6fdc } .k-pdf { --c: #d6372b } .k-docx { --c: #2257b5 } .k-code { --c: #7a4fd0 } .k-txt { --c: #6b7280 } .k-img { --c: #1f9d63 } .k-other { --c: #6b7280 }
.hints { flex: none; display: flex; gap: 14px; align-items: center; padding: 7px 16px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; background: var(--side) }
.hints span { display: inline-flex; gap: 5px; align-items: center }

/* preview pane */
.col, .pv, .reader { display: flex; flex-direction: column; min-height: 0; min-width: 0 }
.pv { background: var(--raised); border-left: 1px solid var(--line) }
.pv-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line) }
.pv-head .t { flex: 1; min-width: 0 }
.pv-head .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mm { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pv-body { flex: 1; min-height: 0; overflow: auto; background: var(--bg); position: relative }
.reader-body { flex: 1; min-height: 0; overflow: auto; background: var(--bg); position: relative; outline: none }

/* documents */
.doc { color: var(--text) }
.dv.preview .doc { font-size: 13.5px; line-height: 1.55; padding: 18px 24px 48px; max-width: 72ch }
.dv.read .doc { font-size: calc(17px * var(--z)); line-height: 1.62; max-width: 70ch; margin: 0 auto; padding: 44px 28px 120px }
.doc h1 { font-size: 1.85em; line-height: 1.15; margin: 0 0 .55em; letter-spacing: -.015em }
.doc h2 { font-size: 1.3em; line-height: 1.25; margin: 1.5em 0 .45em; letter-spacing: -.01em }
.doc h3 { font-size: 1.08em; margin: 1.3em 0 .35em }
.doc p { margin: .65em 0 }
.doc ul, .doc ol { padding-left: 1.35em; margin: .6em 0 }
.doc li { margin: .22em 0 }
.doc li.task { list-style: none; margin-left: -1.35em }
.doc li.task input { margin: 0 .45em 0 0; vertical-align: -1px }
.doc code { font: .86em var(--mono); background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: .05em .3em }
.doc pre { font: .84em/1.5 var(--mono); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: .8em 1em; overflow: auto }
.doc pre code { border: 0; background: none; padding: 0; font-size: 1em }
.doc table { border-collapse: collapse; margin: .9em 0; font-size: .92em }
.doc th, .doc td { border: 1px solid var(--line); padding: .35em .65em; text-align: left }
.doc th { background: var(--raised); font-weight: 600 }
.doc blockquote { margin: .9em 0; padding: .1em 0 .1em 1em; border-left: 3px solid var(--line); color: var(--muted) }
.doc a { color: var(--accent) }
.badge { display: inline-flex; font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; margin-bottom: 1.4em }
.pages { background: var(--page-bg); padding: 22px 16px 80px; display: flex; flex-direction: column; align-items: center; gap: 16px; min-height: 100% }
.page { flex: none; position: relative; width: min(100%, calc(680px * var(--z))); aspect-ratio: 1 / 1.414; overflow: hidden; padding: 7% 8.5%;
  background: #fff; color: #1d1d1f; border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.06);
  font: calc(11.5px * var(--z))/1.5 var(--serif) }
.dv.preview .pages { padding: 16px 12px 40px; gap: 12px }
.dv.preview .page { width: min(100%, 380px); font-size: 6.6px }
.page h1 { font-size: 2.3em; line-height: 1.1; margin: 0 0 .25em }
.page h2 { font-size: 1.35em; margin: .3em 0 .9em; color: #555; font-weight: 500 }
.page p { margin: .6em 0 } .page ul, .page ol { padding-left: 1.3em }
.page table { border-collapse: collapse; margin: 1em 0 }
.page th, .page td { border-bottom: 1px solid #ddd; padding: .3em 1em .3em 0; text-align: left }
.page .fl { display: block; height: .62em; background: #e9e9ed; border-radius: 2px; margin: .62em 0 }
.page .fl.h { height: 1em; width: 45%; background: #d9d9de; margin: 1.6em 0 .9em }
.page .pno { position: absolute; bottom: 3.5%; left: 0; right: 0; text-align: center; color: #999; font-size: .85em }
.more { color: var(--muted); font-size: 12px }
.codev { font: calc(13px * var(--z))/1.6 var(--mono); padding: 18px 0 100px }
.dv.preview .codev { font-size: 11.5px; padding: 12px 0 40px }
.codev .l { display: flex; white-space: pre-wrap; word-break: break-word; padding-right: 24px }
.codev .no { flex: none; width: 4em; text-align: right; padding-right: 1.4em; color: var(--muted); opacity: .55; user-select: none }
.c-kw { color: var(--kw) } .c-str { color: var(--str) } .c-ty { color: var(--ty) } .c-com { color: var(--muted); font-style: italic }
.plaintext { margin: 0 auto; max-width: 80ch; padding: 40px 28px 120px; white-space: pre-wrap; font: calc(14px * var(--z))/1.65 var(--mono) }
.dv.preview .plaintext { font-size: 12px; padding: 16px 22px }
.imgph { margin: 32px auto 10px; width: min(86%, calc(640px * var(--z))); aspect-ratio: 4 / 3; border-radius: 6px; display: grid; place-items: center; color: rgba(0,0,0,.45); font-size: 12px;
  background: linear-gradient(135deg, #a8c0ff 0%, #e8d5f0 55%, #ffd6a5 100%) }
.meta-card { text-align: center; color: var(--muted); font-size: 12px }
.nopv { display: grid; justify-items: center; gap: 10px; padding: 80px 20px; color: var(--muted); text-align: center }
.nopv .ico { width: 44px; height: 52px; font-size: 12px }
.fpv { padding: 16px 20px 40px; max-width: 760px; margin: 0 auto }
.fpv-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px }
.fpv-h b { font-size: 15px }
.fr { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-bottom: 1px solid var(--line) }
.fr .m { margin-left: auto; color: var(--muted); font-size: 11.5px }

/* variant A */
.a-search { flex: 1; min-height: 0; display: flex; flex-direction: column }
.a-top { flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 20px 14px; position: relative }
.a-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(250px, 2fr) minmax(0, 3fr); grid-template-rows: minmax(0, 1fr); border-top: 1px solid var(--line) }
.a-read { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) }
.a-read.nolist, .c-main.nodrawer { grid-template-columns: minmax(0, 1fr) }
.a-read.nolist .side, .c-main.nodrawer .side { display: none }
.side { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--side); border-right: 1px solid var(--line) }

/* variant B */
.b { flex: 1; min-height: 0; display: grid; grid-template-columns: clamp(250px, 32%, 340px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) }
.b.nolist { grid-template-columns: minmax(0, 1fr) }
.b.nolist .b-left { display: none }
.b-left { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--side); border-right: 1px solid var(--line) }
.b-top { flex: none; height: 44px; display: flex; align-items: center }
.b-search { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 0 10px 6px }
.b-search .chip { font-size: 11.5px; padding: 2px 8px }
.b .reader.focused .reader-body { box-shadow: inset 2px 0 0 var(--accent) }

/* variant C */
.tabsbar { flex: none; height: 40px; display: flex; align-items: flex-end; gap: 2px; padding-right: 8px; background: var(--side); border-bottom: 1px solid var(--line); min-width: 0 }
.tabsbar .lights, .tabsbar .tb, .searchbtn { align-self: center }
.tab { height: 32px; min-width: 0; max-width: 190px; flex: 0 1 190px; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 10px; position: relative; top: 1px;
  border-radius: 8px 8px 0 0; font-size: 12.5px; color: var(--muted); border: 1px solid transparent; border-bottom: 0 }
.tab.on { background: var(--bg); color: var(--text); border-color: var(--line) }
.tab .tn { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tab .x { margin-left: auto; flex: none; width: 18px; height: 18px; border-radius: 4px; opacity: .55 }
.tab .x:hover { opacity: 1; background: var(--sel-dim) }
.searchbtn { margin-left: auto; flex: none; height: 28px; display: inline-flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; min-width: 170px;
  border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: var(--bg); font-size: 12px }
.searchbtn span { flex: 1; text-align: left }
.c-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) }
.c-empty { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 70px 24px 24px }
.fakefield { width: min(560px, 100%); height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; font-size: 16px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.04) }
.fakefield span { flex: 1; text-align: left }
.c-empty .recent { width: min(560px, 100%) }
.c-empty .lh { padding-left: 8px }
.ov-bg { position: absolute; inset: 0; z-index: 30; display: flex; justify-content: center; align-items: flex-start; padding-top: 46px; background: rgba(15,16,20,.22) }
.ov { width: min(880px, calc(100% - 40px)); height: min(540px, calc(100% - 80px)); display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.28) }
.ov-top { flex: none; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; border-bottom: 1px solid var(--line) }
.ov-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) }

/* actions palette */
.pal-bg { position: absolute; inset: 0; z-index: 40; background: rgba(15,16,20,.18) }
.palette { position: absolute; z-index: 41; top: 56px; left: 50%; transform: translateX(-50%); width: min(540px, calc(100% - 32px)); overflow: hidden;
  background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 24px 70px rgba(0,0,0,.28) }
.pal-target { display: flex; align-items: center; gap: 8px; padding: 10px 14px 0; font-size: 12px; color: var(--muted) }
.palette input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: 16px var(--ui); padding: 8px 14px 12px; border-bottom: 1px solid var(--line) }
.pal-list { max-height: 330px; overflow: auto; padding: 6px }
.pal-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px }
.pal-row.sel { background: var(--sel); color: var(--sel-text) }
.pal-row small { color: var(--muted) }
.pal-row .sc { margin-left: auto; color: var(--muted); font-size: 12px }

/* prototype chrome (not part of the design) */
#protobar { flex: none; height: 46px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 10px;
  background: #141518; color: #e9e9ec; font: 12px var(--ui); border-top: 1px solid #000; position: relative; z-index: 60 }
#protobar button { height: 28px; padding: 0 10px; border-radius: 999px; color: inherit }
#protobar button:hover { background: #2c2d33 }
#protobar button.on { background: #3a3c44 }
.pb-pill { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 999px; background: #232429 }
.pb-pill .lab { padding: 0 8px; white-space: nowrap }
.pb-pill .lab b { color: #8ab4ff; margin-right: 6px }
.pb-pill .dim { color: #9a9ca5 }
.pb-state { font: 11px var(--mono); color: #8d8f98; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 40% }
@media (max-width: 1100px) { .pb-state { display: none } }

<script type="text/plain" data-doc="~/Proyectos/new-finder/README.md">
# Crawler

macOS Finder is slow and I don't like it. Never have.

I built this for myself and I'm trying to make it as fast as possible. Or rather, as fast as I know how.

## Two ways to use it

- A search bar powered by **fff**, the fastest file finder I know of.
- Yazi-style panels for reading a folder from the terminal.

You can use Vim motions to move around the app.

## Install

```sh
scripts/build.sh
sudo ditto build/Crawler.app /Applications/Crawler.app
```

Link the CLI to open folders from a terminal:

```sh
ln -s "$PWD/scripts/crawler" ~/.local/bin/crawler
crawler ~/Code
```

A file path opens the file directly in the reader.
</script>
<script type="text/plain" data-doc="~/Proyectos/new-finder/AGENTS.md">
# Working on Crawler

## Product and current scope

Crawler is a native macOS Finder replacement built with Swift and AppKit. The shipping source is `Sources/Crawler/`. Scope funnel is the default workspace, with Columns as the other view mode.

Favorites contain Downloads, Desktop and at most one user-pinned folder. The initial workspace is Home, with recent files inside the empty-query view.

## Collaboration rules

- Keep code and explanations simple and concrete.
- Questions are read-only unless the user also requests implementation.
- Preserve unrelated local changes.
- Do not add test files without explicit approval.
- Prefer native platform APIs and strong Swift types over new dependencies.

## Build and run

```sh
scripts/build.sh
open "$PWD/build/Crawler.app"
```

The script runs both dependency bootstraps, builds release, packages resources and VLCKit, strips the packaged executable and signs `build/Crawler.app`.

## Preserve seamless search

Never replace or bypass the resident fuzzy search engine when changing search scope, navigation, themes, or controls. This Mac and `$` current-folder mode must use the same fuzzy matcher; `$` changes only the scope filter.

Do not substitute query-time Spotlight matching, add a debounce, or clear visible results while a replacement query is running.

## Documents and PDF annotations

Code, Markdown, plain text, PDFs and video share `DocumentPreview` between panes and the Space window. Keep file reads, Markdown parsing and Tree-sitter work off the main actor, bounded and cancellation-aware.

Enter, double-click and search activation open PDFs in `PDFReader` inside the Crawler window. Markdown opens in `MarkdownReader` and shares the same cover and restore path.

## Verification

Match verification to the change. For native behavior changes, build the release app and exercise the affected UI; a build alone does not prove behavior. Use disposable data outside personal folders.

import AppKit

/// Full-window Markdown reader. Shares the cover/restore path with the PDF reader.
final class MarkdownReader: NSView {
  private let textView = NSTextView()
  private var scale: CGFloat = 1.0

  func load(_ url: URL) async {
    let text = await PreviewTextLoader.read(url, budget: .reader)
    let styled = MarkdownStyle.reader.render(text)
    textView.textStorage?.setAttributedString(styled)
  }

  // Zoom moves in 10% steps between 70% and 200%.
  func zoom(by step: CGFloat) {
    scale = min(2.0, max(0.7, scale + step))
    relayout()
  }
}

<script type="text/plain" data-doc="~/Proyectos/new-finder/Sources/FFFBridge/engine.rs">
use std::ffi::{c_char, CStr};

/// Scores one query against a prepared snapshot and writes up to `limit` hits.
#[no_mangle]
pub extern "C" fn fff_search(
    snapshot: *const Snapshot,
    query: *const c_char,
    limit: usize,
    out: *mut Hit,
) -> usize {
    let query = unsafe { CStr::from_ptr(query) }.to_string_lossy();
    let snapshot = unsafe { &*snapshot };
    let hits = snapshot.matcher().search(&query, limit);
    for (i, hit) in hits.iter().enumerate() {
        unsafe { out.add(i).write(*hit) };
    }
    hits.len()
}
</script>

# fff

A fast fuzzy file finder with frecency ranking and typo-tolerant matching.

## Features

- SIMD prepared path chunks
- Access-history scoring
- Literal multiword constraints with a fuzzy fallback

## Usage

```rust
let index = Index::build("/")?;
let hits = index.search("readme", 100);
```

<script type="text/plain" data-doc="~/Proyectos/fff/docs/scoring.md">
# Scoring

Each hit combines the fuzzy score, a filename bonus and access-history frecency.

1. Exact filename substring
2. Word-boundary and camelCase matches
3. Path matches, weighted lower

> Trigram signatures only prioritize cache blocks. They never filter candidates.

  if (k === 'Enter' && ev.metaKey) { ev.preventDefault(); editor(e); return true; }
  if (k === 'Enter') { ev.preventDefault(); if (e) e.dir ? enter(e) : onEnter(e, ev); return true; }
  if (k === 'Tab') { ev.preventDefault(); if (e) { reveal(e); render(); } return true; }
  if (ev.metaKey && k === 'ArrowUp') { ev.preventDefault(); up(); return true; }
  if (k === 'Backspace' && !S.query && S.scope) { ev.preventDefault(); Object.assign(S, { scope: null, local: false, sel: 0 }); render(); return true; }
  return false;
}
// Vim-style keys while reading: j/k change document, h/l walk folders, arrows/space scroll.
function readerKey(ev) {
  const k = ev.key, e = cur();
  if (ev.metaKey || ev.ctrlKey) { if (k === 'Enter') editor(target()); return; }
  if (k === 'j') return move(1);
  if (k === 'k') return move(-1);
  if (k === 'h') return up();
  if ((k === 'l' || k === 'Enter') && e?.dir) return enter(e);
  const rb = app.querySelector('[data-scroll="reader"]');
  if (!rb) return;
  if (k === 'ArrowDown' || k === 'ArrowUp') { ev.preventDefault(); rb.scrollBy(0, k === 'ArrowDown' ? 64 : -64); }
  else if (k === ' ') { ev.preventDefault(); rb.scrollBy(0, (ev.shiftKey ? -1 : 1) * rb.clientHeight * 0.85); }
}

// ---------- actions palette (⌘K / ⌘⇧P) ----------
const ACTIONS = [
  { id: 'read', label: 'Read', sc: '↵', ok: t => t && !t.dir },
  { id: 'open', label: 'Open folder', sc: '↵', ok: t => t && t.dir },
  { id: 'editor', label: 'Open in editor', sc: '⌘↵', ok: t => t && !t.dir },
  { id: 'default', label: 'Open with default app', ok: t => t && !t.dir },
  { id: 'reveal', label: 'Show in folder', sc: '⇥', ok: t => !!t },
  { id: 'path', label: 'Copy path', sc: '⌥⌘C', ok: t => !!t },
  { id: 'copy', label: 'Copy to…', ok: t => !!t },
  { id: 'move', label: 'Move to…', ok: t => !!t },
  { id: 'airdrop', label: 'Send with AirDrop', ok: t => t && !t.dir },
  { id: 'activity', label: 'Activity Monitor', note: 'own window', sc: '⌥⌘A', ok: () => true },
  { id: 'theme', label: 'Toggle light / dark', ok: () => true },
];
function openPalette() { S.palette = { step: 'actions', query: '', sel: 0, t: target() }; S.engaged = true; render(); }
function paletteItems() {
  const P = S.palette, q = P.query.trim().toLowerCase();
  if (P.step === 'actions') return ACTIONS.filter(a => a.ok(P.t) && (!q || fuzzy(q, a.label)))
    .map(a => ({ label: a.label, sc: a.sc, note: a.note, run: () => runAction(a.id, P.t) }));
  const here = parentOf(P.t.path);
  return FOLDERS.filter(f => f.path !== here && f.path !== P.t.path && !f.path.startsWith(P.t.path + '/'))
    .map(f => ({ f, m: q ? fuzzy(q, f.path) : { score: 0 } })).filter(x => x.m)
    .sort((a, b) => b.m.score - a.m.score).slice(0, 40)
    .map(({ f }) => ({ label: f.path, icon: icon(f), run: () => finishTransfer(P.action, P.t, f.path) }));
}
function paletteHTML() {
  const P = S.palette, items = paletteItems();
  if (P.sel >= items.length) P.sel = Math.max(0, items.length - 1);
  const title = P.step === 'actions'
    ? (P.t ? `${icon(P.t)}<span>${esc(P.t.name)}</span>` : '<span>No file selected</span>')
    : `<span>${P.action === 'copy' ? 'Copy' : 'Move'} “${esc(P.t.name)}” to…</span>`;
  const rows = items.map((it, i) => `<div class="pal-row ${i === P.sel ? 'sel' : ''}" data-act="pal-row" data-i="${i}">${it.icon ?? ''}<span>${esc(it.label)}</span>${it.note ? `<small>${esc(it.note)}</small>` : ''}<span class="sc">${esc(it.sc ?? '')}</span></div>`).join('');
  return `<div class="pal-bg" data-act="pal-bg"></div><div class="palette"><div class="pal-target">${title}</div><input id="pq" value="${esc(P.query)}" placeholder="${P.step === 'actions' ? 'Type an action…' : 'Type a folder…'}" autocomplete="off" spellcheck="false"><div class="pal-list">${rows || '<div class="empty">Nothing matches.</div>'}</div></div>`;
}
function paletteKey(ev) {
  const k = ev.key, P = S.palette, n = paletteItems().length;
  if (k === 'Escape') { ev.preventDefault(); S.palette = P.step === 'actions' ? null : { step: 'actions', query: '', sel: 0, t: P.t }; render(); }
  else if (k === 'ArrowDown' || (ev.ctrlKey && (k === 'j' || k === 'n'))) { ev.preventDefault(); P.sel = Math.min(n - 1, P.sel + 1); render(); }
  else if (k === 'ArrowUp' || (ev.ctrlKey && (k === 'k' || k === 'p'))) { ev.preventDefault(); P.sel = Math.max(0, P.sel - 1); render(); }
  else if (k === 'Enter') { ev.preventDefault(); paletteItems()[P.sel]?.run(); }
}
function runAction(id, t) {
  S.palette = null;
  if (id === 'read') openFile(t);
  else if (id === 'open') browse(t.path);
  else if (id === 'editor') editor(t);
  else if (id === 'default') toast(`Would open “${t.name}” with its default app.`);
  else if (id === 'reveal') { reveal(t); if (S.variant === 'C') S.listOpen = true; }
  else if (id === 'path') { try { navigator.clipboard.writeText(t.path).catch(() => {}); } catch {} toast(`Copied ${t.path}`); }
  else if (id === 'copy' || id === 'move') S.palette = { step: 'dest', action: id, query: '', sel: 0, t };
  else if (id === 'airdrop') toast(`Would open the native AirDrop picker for “${t.name}”.`);
  else if (id === 'activity') toast('Activity Monitor opens in its own window. Not part of this prototype.');
  else if (id === 'theme') toggleTheme();
  render();
}
function finishTransfer(action, t, dest) {
  S.palette = null;
  const vol = p => p.startsWith('/Volumes/') ? p.split('/').slice(0, 3).join('/') : '~';
  if (action === 'copy') toast(`Prototype: would copy “${t.name}” to ${dest}. Existing names are skipped, never replaced.`);
  else if (vol(t.path) === vol(dest)) toast(`Prototype: would move “${t.name}” to ${dest} (a rename on the same disk).`);
  else toast('Moving to another disk means copy, then delete. Left for a later phase.');
  render();
}

// ---------- render loop ----------
const app = document.getElementById('app');
function wantField() { return S.variant === 'A' ? S.screen === 'search' : S.variant === 'B' ? S.focus === 'field' : S.overlay; }
function keepVisible(row) {
  const box = row.parentElement, top = row.offsetTop, bottom = top + row.offsetHeight;
  if (top < box.scrollTop) box.scrollTop = top - 6;
  else if (bottom > box.scrollTop + box.clientHeight) box.scrollTop = bottom - box.clientHeight + 6;
}
function onReaderScroll(el) {
  const max = el.scrollHeight - el.clientHeight;
  const prog = document.getElementById('prog');
  if (prog) prog.style.width = (max > 0 ? el.scrollTop / max * 100 : 0) + '%';
  const ind = document.getElementById('pageind');
  if (!ind) return;
  const y = el.scrollTop + el.clientHeight * 0.3;
  let page = 1;
  for (const p of el.querySelectorAll('.page')) { if (p.offsetTop <= y) page = +p.dataset.page; else break; }
  ind.textContent = `Page ${page} of ${ind.dataset.total}`;
}
function render() {
  const saved = {};
  for (const el of app.querySelectorAll('[data-scroll]')) saved[el.dataset.scroll + '|' + el.dataset.key] = el.scrollTop;
  const q = document.getElementById('q');
  const caret = q && document.activeElement === q ? q.selectionStart : null;
  const L = list();
  if (S.sel >= L.length) S.sel = Math.max(0, L.length - 1);
  app.innerHTML = VARIANTS[S.variant].render(L) + (S.palette ? paletteHTML() : '');
  for (const el of app.querySelectorAll('[data-scroll]')) {
    const key = el.dataset.scroll + '|' + el.dataset.key;
    if (key in saved) el.scrollTop = saved[key];
  }
  for (const row of app.querySelectorAll('[data-scroll="list"] .row.sel')) keepVisible(row);
  for (const el of app.querySelectorAll('[data-scroll="reader"]')) { el.onscroll = () => onReaderScroll(el); onReaderScroll(el); }
  if (S.engaged && S.palette) document.getElementById('pq')?.focus({ preventScroll: true });
  else if (S.engaged && wantField()) {
    const nq = document.getElementById('q');
    if (nq) {
      nq.focus({ preventScroll: true });
      if (S.selectAll) { nq.select(); S.selectAll = false; }
      else { const c = Math.min(caret ?? nq.value.length, nq.value.length); nq.setSelectionRange(c, c); }
    }
  } else if (app.contains(document.activeElement)) document.activeElement.blur();
  renderBar();
}

// ---------- events ----------
document.addEventListener('pointerdown', () => { S.engaged = true; }, true);
app.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');
  if (!a) { if (S.scopeMenu) { S.scopeMenu = false; render(); } return; }
  const act = a.dataset.act, i = +a.dataset.i;
  if (act !== 'scope-menu' && act !== 'scope' && act !== 'scope-local') S.scopeMenu = false;
  switch (act) {
    case 'row':
      S.sel = i;
      if (S.variant === 'C' && !S.overlay) { const e = cur(); if (e && !e.dir) openTab(e.path); }
      break;
    case 'scope-menu': S.scopeMenu = !S.scopeMenu; break;
    case 'scope': { const p = a.dataset.path || null; Object.assign(S, { scope: p, local: false, sel: 0, scopeMenu: false }); if (p) S.lastFolder = p; break; }
    case 'scope-local': Object.assign(S, { scope: S.lastFolder, local: true, sel: 0, scopeMenu: false }); break;
    case 'kind': S.kind = a.dataset.k; S.sel = 0; break;
    case 'crumb': browse(a.dataset.path); break;
    case 'back': S.screen = 'search'; break;
    case 'toggle-list': S.listOpen = !S.listOpen; break;
    case 'zoom': return zoom(+a.dataset.d);
    case 'editor': return editor(target());
    case 'actions': return openPalette();
    case 'find': return toast('Find in document: not simulated in this prototype.');
    case 'focus-reader': if (S.variant !== 'B' || S.focus === 'reader') return; S.focus = 'reader'; break;
    case 'tab': S.active = i; break;
    case 'tab-close': S.tabs.splice(i, 1); S.active = Math.max(0, Math.min(S.active, S.tabs.length - 1)); break;
    case 'open-overlay': return openOverlay();
    case 'new-tab': return openOverlay(true);
    case 'ov-bg': if (ev.target !== a) return; S.overlay = false; break;
    case 'open-recent': openTab(a.dataset.path); break;
    case 'pal-bg': S.palette = null; break;
    case 'pal-row': S.palette.sel = i; return paletteItems()[i]?.run();
  }
  render();
});
app.addEventListener('dblclick', ev => {
  if (!ev.target.closest('[data-act="row"]')) return;
  const e = cur();
  if (!e) return;
  if (e.dir) enter(e); else { openFile(e); render(); }
});
app.addEventListener('input', ev => {
  if (ev.target.id === 'q') {
    const raw = ev.target.value;
    let v = raw;
    if (v.startsWith('$')) { v = v.slice(1); Object.assign(S, { scope: S.lastFolder, local: true }); }
    if (!v && S.local && !raw.startsWith('$')) Object.assign(S, { scope: null, local: false }); // clearing a $ search restores This Mac
    Object.assign(S, { query: v, sel: 0, scopeMenu: false });
    render();
  } else if (ev.target.id === 'pq') {
    S.palette.query = ev.target.value; S.palette.sel = 0; render();
  }
});
app.addEventListener('focusin', ev => {
  if (ev.target.id === 'q' && S.variant === 'B' && S.focus !== 'field') { S.focus = 'field'; render(); }
});
document.addEventListener('keydown', ev => {
  const k = ev.key, meta = ev.metaKey;
  if (ev.altKey && /^Digit[123]$/.test(ev.code)) { ev.preventDefault(); return switchVariant('ABC'[+ev.code.slice(5) - 1]); }
  if (S.palette) return paletteKey(ev);
  if (meta && (k.toLowerCase() === 'k' || (ev.shiftKey && k.toLowerCase() === 'p'))) { ev.preventDefault(); return openPalette(); }
  if (meta && k.toLowerCase() === 'p') { ev.preventDefault(); return focusSearch(); }
  if (meta && k === '\\') { ev.preventDefault(); S.listOpen = !S.listOpen; return render(); }
  if (meta && (k === '=' || k === '+')) { ev.preventDefault(); return zoom(10); }
  if (meta && k === '-') { ev.preventDefault(); return zoom(-10); }
  if (meta && k === '0') { ev.preventDefault(); S.zoom = 100; return render(); }
  if (meta && k.toLowerCase() === 'f') { ev.preventDefault(); return toast('Find in document: not simulated in this prototype.'); }
  if (S.scopeMenu && k === 'Escape') { S.scopeMenu = false; return render(); }
  VARIANTS[S.variant].key(ev, ev.target instanceof HTMLInputElement);
});
function focusSearch() {
  S.engaged = true;
  if (S.variant === 'C') return openOverlay();
  if (S.variant === 'A') S.screen = 'search'; else S.focus = 'field';
  S.selectAll = true;
  render();
}

// ---------- prototype chrome ----------
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2800);
}
function toggleTheme() {
  const dark = getComputedStyle(document.documentElement).getPropertyValue('--is-dark').trim() === '1';
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
}
function launch(mode) {
  Object.assign(S, { launch: mode, query: '', scope: null, local: false, kind: 'all', sel: 0, scopeMenu: false, palette: null, overlay: false, zoom: 100, tabs: [], active: 0, lastFolder: '~' });
  if (mode === 'cli') {
    browse('~/Proyectos/new-finder');
    S.sel = Math.max(0, list().findIndex(it => it.e.name === 'README.md'));
    Object.assign(S, { screen: 'read', focus: 'reader', tabs: [cur().path], listOpen: true });
  } else {
    Object.assign(S, { screen: 'search', focus: 'field', listOpen: S.variant !== 'C' });
  }
  render();
}
function switchVariant(v) {
  if (v === S.variant) return;
  const e = target();
  const reading = S.variant === 'A' ? S.screen === 'read' : S.variant === 'B' ? S.focus === 'reader' : S.tabs.length > 0 && !S.overlay;
  Object.assign(S, { variant: v, overlay: false, palette: null, scopeMenu: false, screen: reading ? 'read' : 'search', focus: reading ? 'reader' : 'field' });
  if (v === 'C') Object.assign(S, { tabs: reading && e && !e.dir ? [e.path] : [], active: 0, listOpen: reading && S.launch === 'cli' });
  else S.listOpen = true;
  render();
}
const HELP = {
  A: { idea: 'Buscar ocupa la ventana: campo, filtros, lista y vista previa. ↵ abre Leer a pantalla completa con una lista estrecha a la izquierda. Esc vuelve a Buscar con la misma selección.',
    keys: [['↑↓ ⌃J ⌃K', 'mover en la lista'], ['↵', 'leer · entrar en carpeta'], ['⇥', 'ver la carpeta del fichero'], ['$', 'buscar en la carpeta actual'], ['⌫', 'con el campo vacío, volver a This Mac'],
      ['j k', 'en Leer: documento siguiente / anterior'], ['h l', 'en Leer: subir / entrar en carpeta'], ['↑↓ espacio', 'en Leer: scroll'], ['⌘\\', 'mostrar u ocultar la lista'], ['Esc', 'volver a Buscar']] },
  B: { idea: 'Una sola pantalla: lista a la izquierda y lector a la derecha, siempre. No hay vista previa aparte; lo que seleccionas ya está abierto en el lector. ↵ pasa el foco al lector y Esc lo devuelve al campo.',
    keys: [['↑↓ ⌃J ⌃K', 'mover (foco en el campo)'], ['↵', 'foco al lector · entrar en carpeta'], ['⇥', 'ver la carpeta del fichero'], ['$', 'buscar en la carpeta actual'],
      ['j k', 'en el lector: documento siguiente / anterior'], ['h l', 'en el lector: subir / entrar en carpeta'], ['↑↓ espacio', 'en el lector: scroll'], ['Esc /', 'volver al campo'], ['⌘\\', 'ocultar la lista']] },
  C: { idea: 'El lector es la ventana y cada documento es una pestaña. Buscar es una paleta encima (⌘P o el botón). La lista lateral (⌘\\) muestra la última búsqueda o la carpeta.',
    keys: [['⌘P /', 'abrir la paleta de búsqueda'], ['↵', 'abrir en la pestaña actual'], ['⌥↵ +', 'abrir en pestaña nueva'], ['⇥', 'ver la carpeta en el lateral'],
      ['j k', 'documento siguiente / anterior'], ['h l', 'subir / entrar en carpeta'], ['⌘\\', 'mostrar u ocultar el lateral'], ['Esc', 'cerrar la paleta']] },
};
const COMMON_KEYS = [['⌘K ⌘⇧P', 'acciones: copiar a…, mover a…, AirDrop'], ['⌘+ ⌘− ⌘0', 'zoom'], ['⌥1 ⌥2 ⌥3', 'cambiar de variante']];
const bar = document.getElementById('protobar');
const help = document.getElementById('help');
function renderBar() {
  const e = target();
  const where = S.variant === 'A' ? `pantalla=${S.screen === 'search' ? 'buscar' : 'leer'}`
    : S.variant === 'B' ? `foco=${S.focus === 'field' ? 'campo' : 'lector'}`
    : `paleta=${S.overlay ? 'abierta' : 'cerrada'} pestañas=${S.tabs.length}`;
  bar.innerHTML = `<div class="pb-pill"><button data-pb="prev" title="Variante anterior (⌥1-3)">‹</button><span class="lab"><b>${S.variant}</b>${VARIANTS[S.variant].name}</span><button data-pb="next" title="Variante siguiente">›</button></div>
    <div class="pb-pill"><span class="lab dim">Arranque</span><button data-pb="launch" data-m="app" class="${S.launch === 'app' ? 'on' : ''}">App</button><button data-pb="launch" data-m="cli" class="${S.launch === 'cli' ? 'on' : ''}" title="Simula abrir una carpeta desde terminal">crawler ~/…/new-finder</button></div>
    <button data-pb="theme" title="Tema claro u oscuro">◐</button><button data-pb="help" class="${S.help ? 'on' : ''}" title="Idea y teclas de la variante">?</button>
    <code class="pb-state">${esc(where)} · ámbito=${esc(scopeLabel())} · consulta="${esc(S.query)}" · tipo=${S.kind} · sel=${esc(e?.name ?? '—')}</code>`;
  help.hidden = !S.help;
  if (S.help) {
    const H = HELP[S.variant];
    help.innerHTML = `<button class="x" data-pb="help" title="Cerrar">×</button><h4>${S.variant} · ${VARIANTS[S.variant].name}</h4><p>${esc(H.idea)}</p><dl>${[...H.keys, ...COMMON_KEYS].map(([k, d]) => `<dt>${esc(k)}</dt><dd>${esc(d)}</dd>`).join('')}</dl><p class="foot">Datos simulados: nada toca el disco. «crawler ~/…/new-finder» simula abrir una carpeta desde terminal.</p>`;
  }
  try {
    const u = new URL(location.href);
    u.searchParams.set('variant', S.variant);
    u.searchParams.set('launch', S.launch);
    history.replaceState(null, '', u);
  } catch {}
}
function onBarClick(ev) {
  const b = ev.target.closest('[data-pb]');
  if (!b) return;
  const act = b.dataset.pb;
  if (act === 'prev' || act === 'next') switchVariant('ABC'[('ABC'.indexOf(S.variant) + (act === 'next' ? 1 : 2)) % 3]);
  else if (act === 'launch') launch(b.dataset.m);
  else if (act === 'theme') toggleTheme();
  else if (act === 'help') { S.help = !S.help; renderBar(); }
}
bar.addEventListener('click', onBarClick);
help.addEventListener('click', onBarClick);

// Full window when opened directly in a browser; fixed height when embedded.
if (window.self === window.top && window.innerWidth >= 1000) {
  document.documentElement.classList.add('standalone');
  const fit = () => document.documentElement.style.setProperty('--frame-h', innerHeight + 'px');
  fit();
  addEventListener('resize', fit);
  S.engaged = true;
}
launch(S.launch);
</script>
</body>
</html>
