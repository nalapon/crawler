[data-theme="linux"] { --bg: #2c202d; --raised: #392b3a; --side: #221923; --text: #f2eaf0; --muted: #bfaebc; --line: #59455a; --accent: #ffa077; --accent-text: #321307; --sel: #613e47; --sel-text: #ffe8de; --folder-fill: #ffa077; --r: 9px; --r-btn: 9px; --seg-r: 9px; --r-row: 8px; --frame-r: 14px; --font: Ubuntu, Cantarell, -apple-system, BlinkMacSystemFont, sans-serif }
[data-theme="linuxRetro"] { --bg: #e8e7df; --raised: #c8c7bd; --side: #bdbfb7; --text: #202921; --muted: #424c41; --line: #7c8378; --accent: #365b47; --accent-text: #fff; --sel: #365b47; --sel-text: #fff }

/* ---------- base ---------- */
* { box-sizing: border-box }
html, body { margin: 0 }
html.standalone body { background: #1b1c20 }
:where(.frame) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: default; text-align: inherit }
:where(.frame) input { font: inherit; color: inherit; margin: 0 }
.stage { height: var(--stage-h, 760px); display: flex; flex-direction: column; position: relative }
.frame { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; overflow: hidden;
  background: var(--window-bg); color: var(--text); font: var(--fs)/1.4 var(--font); -webkit-font-smoothing: var(--smooth);
  border: var(--frame-border); border-radius: var(--frame-r); box-shadow: var(--frame-shadow); padding: var(--frame-pad) }
html.standalone .frame { border-radius: 0 }
.frame ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent) }
[data-family^="retro"] .frame ::selection, [data-family="terminal"] .frame ::selection { background: var(--sel); color: var(--sel-text) }
.frame :focus-visible { outline: var(--focus-outline); outline-offset: 1px }
.frame input:focus-visible { outline: none }
.frame kbd { font: 10.5px/1 var(--font); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--hair); color: var(--muted); background: var(--bg) }
.sp { flex: 1 }
.muted { color: var(--muted) }
.num { font-variant-numeric: tabular-nums }

/* icons */
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: var(--sw); stroke-linecap: var(--cap); stroke-linejoin: var(--join); shape-rendering: var(--crisp) }
.ic rect { rx: var(--icon-rx) }
.ic .f { fill: currentColor; stroke: none }
.fold { width: 18px; height: 16px; flex: none; fill: var(--folder-fill); stroke: var(--folder-stroke); stroke-width: 1; shape-rendering: var(--crisp) }
.bdg { flex: none; width: 18px; height: 22px; display: grid; place-items: center; border-radius: var(--badge-r); font: 700 7px/1 var(--font); letter-spacing: .02em;
  color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent) }
.k-md { --c: #2f6fdc } .k-pdf { --c: #d6372b } .k-docx { --c: #2257b5 } .k-code { --c: #7a4fd0 } .k-txt { --c: #6b7280 } .k-img { --c: #1f9d63 } .k-other { --c: #6b7280 }
[data-family="retro-mac"] .bdg, [data-family="terminal"] .bdg { color: var(--text); background: var(--bg); border-color: var(--text) }
[data-family="retro-win"] .bdg, [data-family="retro-unix"] .bdg { background: #fff; border-color: #000 }
.lights { display: flex; gap: 8px; padding: 0 14px; flex: none }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: #ff5f57 }
.lights i:nth-child(2) { background: #febc2e } .lights i:nth-child(3) { background: #28c840 }

/* ---------- shell ---------- */
.titlebar { flex: none; height: 42px; display: flex; align-items: center; gap: 4px; padding-right: 8px; background: var(--tb-bg); border-bottom: var(--tool-border) }
.navtabs { display: flex; gap: 3px; align-items: center; min-width: 0 }
.navtab { height: 28px; display: inline-flex; align-items: center; gap: 7px; padding: 0 11px; border-radius: var(--r); white-space: nowrap;
  background: var(--tab-bg); color: var(--tab-fg); box-shadow: var(--tab-raise); font-weight: var(--tab-weight) }
.navtab:hover { color: var(--text) }
.navtab.on { background: var(--tab-act-bg); color: var(--tab-act-fg); box-shadow: var(--tab-act-shadow) }
.navtab .ic { width: 15px; height: 15px }
.body { flex: 1; min-height: 0; display: flex }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column }
.toolbar { flex: none; min-height: 50px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 12px; background: var(--tool-bg); border-bottom: var(--tool-border) }
.tool-title { font-weight: 700; font-size: calc(var(--fs) + 1px); white-space: nowrap }
.work { flex: 1; min-height: 0; display: flex }
.split { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(250px, 32%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
  gap: var(--gap); padding: var(--gap-pad); background: var(--chrome) }
.split.solo { grid-template-columns: minmax(0, 1fr) }
.split.solo > .pane:first-child { display: none }
.split.inspect { grid-template-columns: minmax(0, 1fr) minmax(250px, 300px) }
.single { flex: 1; min-width: 0; display: flex; padding: var(--gap-pad); background: var(--chrome) }
.single > .pane { flex: 1 }
.sidebar { width: 200px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: 0 8px 10px; background: var(--side-bg); border-right: var(--tool-border); overflow: auto }
[data-family^="retro"] .sidebar { border-right: 0 }
[data-family="retro-mac"] .sidebar { border-right: 1px solid #000 }
.side-top { height: 50px; flex: none; display: flex; align-items: center; margin: 0 -8px }
.snav { height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: var(--r); color: var(--text); white-space: nowrap; flex: none }
.snav:hover { background: var(--hover) }
.snav.on { background: var(--tab-act-bg); color: var(--tab-act-fg); box-shadow: var(--tab-act-shadow) }
.snav .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis }
.snav .kb { font-size: 11px; color: var(--muted) }
.snav.on .kb { color: inherit; opacity: .7 }
.grp { margin: 16px 10px 4px; font-size: 11px; font-weight: 700; color: var(--muted) }

/* panes: the active one shows it in its title strip */
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--pane-bg); box-shadow: var(--pane-shadow); padding: var(--pane-pad) }
.ptitle { flex: none; height: var(--pt-h); display: flex; align-items: center; gap: 4px; padding: 0 4px 0 12px; position: relative; min-width: 0;
  background: var(--pt-bg); color: var(--pt-fg); border-bottom: var(--pt-border); font-weight: var(--pt-weight); font-size: calc(var(--fs) - .5px); white-space: nowrap }
.ptitle > * { position: relative; z-index: 1 }
.ptitle::before { content: ""; position: absolute; inset: var(--pt-inset); z-index: 0 }
.pane.active > .ptitle, .palette > .ptitle { background: var(--pt-act-bg); color: var(--pt-act-fg) }
.pane.active > .ptitle::before, .palette > .ptitle::before { background: var(--pt-act-image) }
.pt-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pt-dot-off); flex: none; margin-right: 4px }
.pane.active .pt-dot { background: var(--pt-dot) }
.pt-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; overflow: hidden; background: var(--pt-label-bg); padding: 0 var(--pt-label-pad) }
.pt-text > span { overflow: hidden; text-overflow: ellipsis }
.pt-sub { font-weight: 400; opacity: .72 }
.pt-text button { color: inherit; padding: 1px 2px; border-radius: 3px }
.pt-text button:hover { text-decoration: underline }
.pt-text .sepr { opacity: .55 }
.ptitle .ibtn, .ptitle .stepper { background: var(--pt-btn-bg) }
.pageind { font-weight: 400; font-size: 11.5px; padding: 0 6px; background: var(--pt-btn-bg) }
.prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent); z-index: 2 }
.pane.active .prog { background: var(--pt-act-fg) }
[data-family="modern"] .pane.active .prog { background: var(--accent) }
.well { flex: 1; min-height: 0; display: flex; background: var(--bg); box-shadow: var(--well-shadow); padding: var(--well-pad); margin-top: var(--well-mt) }
.scroll { flex: 1; min-width: 0; overflow: auto; position: relative }

/* status bar */
.status { flex: none; height: 27px; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: var(--st-bg); border-top: var(--st-border); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden }
[data-family="retro-win"] .status, [data-family="retro-unix"] .status { padding: 3px 0 0; height: 26px }
.st { display: inline-flex; align-items: center; gap: 6px; height: 21px; padding: 0 7px; box-shadow: var(--st-field-shadow); min-width: 0; overflow: hidden; text-overflow: ellipsis }
.st.grow { flex: 1; display: block; line-height: 21px }
button.st:hover { color: var(--text) }
.st .ic { width: 13px; height: 13px }
.st .bar { width: 64px; height: 8px }
.ok { color: var(--ok) } .warn { color: var(--warn) } .err { color: var(--err) }

/* ---------- controls ---------- */
.btn { height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; white-space: nowrap; flex: none;
  border: 1px solid var(--ctl-border); border-radius: var(--r-btn); background: var(--ctl-bg); color: var(--ctl-fg); box-shadow: var(--raise) }
.btn:hover { background-image: linear-gradient(var(--hover), var(--hover)) }
.btn:active:not(:disabled) { box-shadow: var(--sunk) }
.btn:disabled { opacity: .45 }
.btn .ic { width: 14px; height: 14px }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent }
[data-family="retro-mac"] .btn.primary { background: #fff; color: #000; border-color: #000; box-shadow: 0 0 0 2px #fff, 0 0 0 3px #000 }
[data-family="retro-win"] .btn.primary { background: #d4d0c8; color: #000; box-shadow: 0 0 0 1px #000, var(--raise) }
[data-family="retro-unix"] .btn.primary { background: #c8c7bd; color: #202921; box-shadow: 0 0 0 1px #202921, var(--raise) }
[data-family="terminal"] .btn.primary { color: var(--bg) }
[data-family="retro-win"] .btn:disabled { opacity: 1; color: #808080; text-shadow: 1px 1px #fff }
.ibtn { width: 26px; height: 24px; display: inline-grid; place-items: center; border-radius: var(--r); color: inherit; flex: none }
.ibtn:hover { background-image: linear-gradient(var(--hover), var(--hover)); box-shadow: var(--ibtn-hover-shadow) }
.ibtn.on { color: var(--ibtn-on); box-shadow: var(--ibtn-on-shadow) }
.stepper { display: inline-flex; align-items: center; flex: none }
.stepper .zv { min-width: 40px; text-align: center; font-weight: 400; font-size: 11.5px; font-variant-numeric: tabular-nums }
.field { position: relative; display: flex; align-items: center; gap: 8px; height: 30px; min-width: 0; padding: 0 4px 0 9px; color: var(--muted);
  background: var(--field-bg); border: 1px solid var(--field-border); border-radius: var(--r); box-shadow: var(--field-shadow) }
.field:focus-within { box-shadow: var(--field-shadow), var(--focus) }
.field.local { background: color-mix(in srgb, var(--accent) 8%, var(--field-bg)) }
.field input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-size: calc(var(--fs) + 1px) }
.field input::placeholder { color: var(--muted); opacity: .85 }
.field.big { height: 36px; flex: 1 1 320px; max-width: 680px }
.field.big input { font-size: calc(var(--fs) + 3px) }
.field .ic { width: 15px; height: 15px }
.scope-btn { flex: none; max-width: 170px; height: 26px; display: inline-flex; align-items: center; gap: 5px; padding: 0 6px 0 9px; font-size: 12px; color: var(--ctl-fg);
  border-radius: max(0px, calc(var(--r) - 2px)); background: var(--seg-bg); box-shadow: var(--seg-btn-raise); border: 1px solid var(--seg-border) }
.scope-btn span { overflow: hidden; text-overflow: ellipsis }
.scope-btn .ic { width: 12px; height: 12px }
.field.local .scope-btn { color: var(--accent) }
[data-family^="retro"] .field.local .scope-btn, [data-family="terminal"] .field.local .scope-btn { color: inherit; font-weight: 700 }
.seg { display: inline-flex; flex: none; gap: var(--seg-gap); padding: var(--seg-pad); background: var(--seg-bg); border: 1px solid var(--seg-border); border-radius: var(--seg-r) }
.seg button { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; white-space: nowrap; font-size: 12px;
  border-radius: max(0px, calc(var(--seg-r) - 2px)); background: var(--seg-btn-bg); box-shadow: var(--seg-btn-raise); color: var(--seg-fg) }
.seg button:hover { color: var(--text) }
.seg button.on { background: var(--seg-on-bg); color: var(--seg-on-fg); box-shadow: var(--seg-on-shadow) }
.seg button .ic { width: 14px; height: 14px }
[data-family="retro-mac"] .seg button + button { border-left: 1px solid #000 }
[data-family="terminal"] .seg button + button { border-left: 1px solid var(--line) }
.select { min-width: 190px; justify-content: space-between }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 22px }
.check .box { width: 15px; height: 15px; flex: none; display: grid; place-items: center; color: var(--check-on-fg);
  background: var(--field-bg); border: 1px solid var(--field-border); border-radius: var(--check-r); box-shadow: var(--field-shadow) }
.check.on .box { background: var(--check-on-bg); border-color: var(--check-on-border) }
.check .box .ic { width: 12px; height: 12px; stroke-width: 2 }
.bar { height: 10px; flex: none; overflow: hidden; padding: var(--bar-pad);
  background: var(--bar-track); border: 1px solid var(--bar-border); border-radius: var(--bar-r); box-shadow: var(--bar-shadow) }
.bar > i { display: block; height: 100%; background: var(--bar-fill); border-radius: inherit; transition: width .35s ease-out }

/* lists */
.list { padding: 4px 0 12px }
.row { display: flex; align-items: center; gap: 10px; margin: 0 var(--row-inset); padding: var(--row-py) 10px; border-radius: var(--r-row); min-width: 0 }
.row:hover { background: var(--hover) }
.row .t { flex: 1; min-width: 0 }
.row .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.row .p { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.row .m { flex: none; font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums }
.row .chev { width: 12px; height: 12px; color: var(--muted) }
.row.sel { background: var(--sel-dim); color: var(--sel-dim-text); box-shadow: var(--sel-dim-ring) }
.pane.active .row.sel { background: var(--sel); color: var(--sel-text); box-shadow: none }
.pane.active .row.sel .p, .pane.active .row.sel .m, .pane.active .row.sel .chev { color: inherit; opacity: .78 }
.row mark { background: none; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px }
.empty { padding: 24px 16px; color: var(--muted); line-height: 1.5 }
.empty b { color: var(--text) }

/* ---------- documents ---------- */
.doc { font-family: var(--read-font); color: var(--text); -webkit-font-smoothing: antialiased }
.dv.read .doc { font-size: calc(var(--read-fs) * var(--z)); line-height: 1.62; max-width: var(--measure); margin: 0 auto; padding: 40px 28px 120px }
.doc h1 { font-size: 1.8em; line-height: 1.15; margin: 0 0 .55em; letter-spacing: -.012em }
.doc h2 { font-size: 1.28em; line-height: 1.25; margin: 1.5em 0 .45em }
.doc h3 { font-size: 1.06em; margin: 1.3em 0 .35em }
.doc p { margin: .65em 0 }
.doc ul, .doc ol { padding-left: 1.35em; margin: .6em 0 }
.doc li { margin: .22em 0 }
.doc li.task { list-style: none; margin-left: -1.35em; display: flex; gap: .5em; align-items: baseline }
.doc li.task .box { width: .8em; height: .8em; border: 1px solid currentColor; border-radius: var(--check-r); flex: none; display: inline-grid; place-items: center; position: relative; top: .08em }
.doc li.task .box .ic { width: .75em; height: .75em; stroke-width: 2.5 }
.doc code { font: .86em var(--mono); background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 4px; padding: .05em .3em }
.doc pre { font: .82em/1.5 var(--mono); background: var(--code-bg); border: 1px solid var(--code-border); border-radius: var(--r); padding: .8em 1em; overflow: auto; -webkit-font-smoothing: var(--smooth) }
.doc pre code { border: 0; background: none; padding: 0; font-size: 1em }
.doc table { border-collapse: collapse; margin: .9em 0; font-size: .9em }
.doc th, .doc td { border: 1px solid var(--hair); padding: .35em .65em; text-align: left }
.doc th { background: var(--code-bg) }
.doc blockquote { margin: .9em 0; padding: .1em 0 .1em 1em; border-left: 1px solid var(--hair); color: var(--muted) }
.word-note { display: inline-flex; font: 11.5px var(--font); color: var(--muted); border: 1px solid var(--hair); border-radius: var(--r); padding: 2px 8px; margin-bottom: 1.4em }
.pages { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 22px 16px 80px; background: var(--page-bg); background-image: var(--page-image) }
.page { flex: none; position: relative; width: min(100%, calc(680px * var(--z))); aspect-ratio: 1 / 1.414; overflow: hidden; padding: 7% 8.5%;
  background: #fff; color: #1d1d1f; border: var(--page-border); box-shadow: var(--page-shadow); font: calc(11.5px * var(--z))/1.5 var(--read-font) }
.page h1 { font-size: 2.2em; line-height: 1.1; margin: 0 0 .25em } .page h2 { font-size: 1.3em; margin: .3em 0 .9em; color: #555; font-weight: 500 }
.page p { margin: .6em 0 } .page ul, .page ol { padding-left: 1.3em }
.page table { border-collapse: collapse; margin: 1em 0 } .page th, .page td { border-bottom: 1px solid #ddd; padding: .3em 1em .3em 0; text-align: left }
.page .fl { height: .62em; background: #e6e6ea; margin: .62em 0 } .page .fl.h { height: 1em; width: 45%; background: #d4d4da; margin: 1.6em 0 .9em }
.page .pno { position: absolute; bottom: 3.5%; left: 0; right: 0; text-align: center; color: #999; font-size: .85em }
.codev { font: calc(13px * var(--z))/1.6 var(--mono); padding: 18px 0 100px; -webkit-font-smoothing: var(--smooth) }
.codev .l { display: flex; white-space: pre-wrap; word-break: break-word; padding-right: 24px }
.codev .no { flex: none; width: 4em; text-align: right; padding-right: 1.4em; color: var(--muted); opacity: .6; user-select: none }
.c-kw { color: var(--kw); font-weight: var(--kw-weight) } .c-str { color: var(--str) } .c-ty { color: var(--ty) } .c-com { color: var(--com); font-style: italic }
.plaintext { margin: 0 auto; max-width: 80ch; padding: 40px 28px 120px; white-space: pre-wrap; font: calc(14px * var(--z))/1.65 var(--mono) }
.imgph { margin: 32px auto 10px; width: min(86%, calc(640px * var(--z))); aspect-ratio: 4 / 3; display: grid; place-items: center; color: rgba(0,0,0,.5); font-size: 12px;
  background: linear-gradient(135deg, #a8c0ff 0%, #e8d5f0 55%, #ffd6a5 100%); border: var(--page-border) }
.meta-card { text-align: center; color: var(--muted); font-size: 12px }
.nopv { display: grid; justify-items: center; gap: 10px; padding: 80px 24px; color: var(--muted); text-align: center; line-height: 1.5 }
.nopv .bdg { width: 40px; height: 48px; font-size: 11px }
.fpv { padding: 18px 22px 40px; max-width: 760px; margin: 0 auto }
.fpv-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px }
.fpv-h b { font-size: calc(var(--fs) + 3px) }
.fr { display: flex; align-items: center; gap: 10px; padding: 5px 4px; border-bottom: 1px solid var(--hair) }
.fr .m { margin-left: auto; color: var(--muted); font-size: 11.5px }

/* ---------- activity ---------- */
.meters { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center }
.meter { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--muted); font-size: 12px }
.meter b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums }
.meter .bar { width: 80px }
table.procs { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums }
.procs th { position: sticky; top: 0; z-index: 1; height: 26px; padding: 0 10px; text-align: left; white-space: nowrap; font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--th-bg); box-shadow: var(--th-shadow) }
.procs th button { display: inline-flex; align-items: center; gap: 4px; font-weight: inherit }
.procs th.sorted { color: var(--text) }
.procs th .ic { width: 11px; height: 11px }
.procs .r { text-align: right }
.procs td { padding: var(--row-py) 10px; white-space: nowrap; border-bottom: 1px solid color-mix(in srgb, var(--hair) 55%, transparent) }

<script type="text/plain" data-doc="~/Proyectos/new-finder/README.md">
# Crawler

macOS Finder is slow and I don't like it. Never have.

I built this for myself and I'm trying to make it as fast as possible. Or rather, as fast as I know how.

## Two ways to use it

- A search bar powered by **fff**, the fastest file finder I know of.
- Yazi-style panels for reading a folder from the terminal.

You can use Vim motions to move around the app.

## Install

```sh
scripts/build.sh
sudo ditto build/Crawler.app /Applications/Crawler.app
```

Link the CLI to open folders from a terminal:

```sh
ln -s "$PWD/scripts/crawler" ~/.local/bin/crawler
crawler ~/Code
```

A file path opens the file directly in the reader.
</script>
<script type="text/plain" data-doc="~/Proyectos/new-finder/AGENTS.md">
# Working on Crawler

## Product and current scope

Crawler is a native macOS Finder replacement built with Swift and AppKit. The shipping source is `Sources/Crawler/`. Scope funnel is the default workspace, with Columns as the other view mode.

Favorites contain Downloads, Desktop and at most one user-pinned folder. The initial workspace is Home, with recent files inside the empty-query view.

## Collaboration rules

- Keep code and explanations simple and concrete.
- Questions are read-only unless the user also requests implementation.
- Preserve unrelated local changes.
- Do not add test files without explicit approval.
- Prefer native platform APIs and strong Swift types over new dependencies.

## Build and run

```sh
scripts/build.sh
open "$PWD/build/Crawler.app"
```

The script runs both dependency bootstraps, builds release, packages resources and VLCKit, strips the packaged executable and signs `build/Crawler.app`.

## Preserve seamless search

Never replace or bypass the resident fuzzy search engine when changing search scope, navigation, themes, or controls. This Mac and `$` current-folder mode must use the same fuzzy matcher; `$` changes only the scope filter.

Do not substitute query-time Spotlight matching, add a debounce, or clear visible results while a replacement query is running.

## Documents and PDF annotations

Code, Markdown, plain text, PDFs and video share `DocumentPreview` between panes and the Space window. Keep file reads, Markdown parsing and Tree-sitter work off the main actor, bounded and cancellation-aware.

Enter, double-click and search activation open PDFs in `PDFReader` inside the Crawler window. Markdown opens in `MarkdownReader` and shares the same cover and restore path.

## Verification

Match verification to the change. For native behavior changes, build the release app and exercise the affected UI; a build alone does not prove behavior. Use disposable data outside personal folders.
</script>

import AppKit

/// Full-window Markdown reader. Shares the cover/restore path with the PDF reader.
final class MarkdownReader: NSView {
  private let textView = NSTextView()
  private var scale: CGFloat = 1.0

  func load(_ url: URL) async {
    let text = await PreviewTextLoader.read(url, budget: .reader)
    let styled = MarkdownStyle.reader.render(text)
    textView.textStorage?.setAttributedString(styled)
  }

  // Zoom moves in 10% steps between 70% and 200%.
  func zoom(by step: CGFloat) {
    scale = min(2.0, max(0.7, scale + step))
    relayout()
  }
}
</script>

<script type="text/plain" data-doc="~/Proyectos/new-finder/Sources/FFFBridge/engine.rs">
use std::ffi::{c_char, CStr};

/// Scores one query against a prepared snapshot and writes up to `limit` hits.
#[no_mangle]
pub extern "C" fn fff_search(
    snapshot: *const Snapshot,
    query: *const c_char,
    limit: usize,
    out: *mut Hit,
) -> usize {
    let query = unsafe { CStr::from_ptr(query) }.to_string_lossy();
    let snapshot = unsafe { &*snapshot };
    let hits = snapshot.matcher().search(&query, limit);
    for (i, hit) in hits.iter().enumerate() {
        unsafe { out.add(i).write(*hit) };
    }
    hits.len()
}
</script>

# fff

A fast fuzzy file finder with frecency ranking and typo-tolerant matching.

## Features

- SIMD prepared path chunks
- Access-history scoring
- Literal multiword constraints with a fuzzy fallback

## Usage

```rust
let index = Index::build("/")?;
let hits = index.search("readme", 100);
```

<script type="text/plain" data-doc="~/Proyectos/fff/docs/scoring.md">
# Scoring

Each hit combines the fuzzy score, a filename bonus and access-history frecency.

1. Exact filename substring
2. Word-boundary and camelCase matches
3. Path matches, weighted lower

> Trigram signatures only prioritize cache blocks. They never filter candidates.
</script>

    } else if ((m = l.match(/^(#{1,3})\s+(.*)/))) {

        const c = t.match(/^\[( |x)\]\s+(.*)/);

    } else if (/^>/.test(l)) {

    } else if (/^\|/.test(l)) {

function pdfHTML(e) {

const KW = {

}

function docHTML(e) {

function searchView() {
  const L = searchList(), e = L[S.sel]?.e;

  const empty = q ? `<div class="empty">No files match <b>${esc(q)}</b> in ${esc(scopeLabel())}.${S.scope ? ' Press <kbd>⌫</kbd> twice to search This Mac.' : ' Try fewer letters.'}</div>` : '<div class="empty">Nothing here yet.</div>';

function searchKey(ev, typing) {
  const L = searchList(), e = L[S.sel]?.e, k = ev.key;
  if (S.spane === 'list') {
    if (k === 'ArrowDown' || (ev.ctrlKey && (k === 'j' || k === 'n'))) { ev.preventDefault(); S.sel = clamp(S.sel + 1, L.length); return render(); }
    if (k === 'ArrowUp' || (ev.ctrlKey && (k === 'k' || k === 'p'))) { ev.preventDefault(); S.sel = clamp(S.sel - 1, L.length); return render(); }
    if (k === 'Enter' && ev.metaKey) { ev.preventDefault(); return editor(e); }
    if (k === 'Enter') { ev.preventDefault(); if (!e) return; if (e.dir) return openFolder(e.path); S.spane = 'doc'; S.focusId = null; return render(); }
    if (k === 'Tab') { ev.preventDefault(); if (e) revealInFolders(e); return; }
    if (k === 'Escape' && S.query) { S.query = ''; S.sel = 0; return render(); }
    if (k === 'Backspace' && typing && !S.query && S.scope) { ev.preventDefault(); Object.assign(S, { scope: null, local: false, sel: 0 }); return render(); }
    if (!typing && k.length === 1 && !ev.metaKey && !ev.ctrlKey && !ev.altKey) { S.focusId = 'q'; document.getElementById('q')?.focus(); }
    return;

  if (k === 'j' || k === 'k') { S.sel = clamp(S.sel + (k === 'j' ? 1 : -1), L.length); return render(); }
  if (k === 'Enter' && ev.metaKey) return editor(e);

}

function foldersKey(ev, typing) {
  const L = folderList(), e = L[S.fsel]?.e, k = ev.key;
  const move = d => { S.fsel = clamp(S.fsel + d, L.length); render(); };
  const open = () => { if (!e) return; if (e.dir) enterFolder(e.path); else { S.fpane = 'doc'; S.focusId = null; render(); } };
  if (typing) {
    if (k === 'ArrowDown' || (ev.ctrlKey && k === 'j')) { ev.preventDefault(); move(1); }
    else if (k === 'ArrowUp' || (ev.ctrlKey && k === 'k')) { ev.preventDefault(); move(-1); }
    else if (k === 'Enter') { ev.preventDefault(); open(); }
    else if (k === 'Escape') { if (S.ffilter) { S.ffilter = ''; S.fsel = 0; } else S.focusId = null; render(); }
    return;
  }
  if (k === 'Enter' && ev.metaKey) return editor(e);
  if (S.fpane === 'list') {
    if (k === 'j' || k === 'ArrowDown') { ev.preventDefault(); move(1); }
    else if (k === 'k' || k === 'ArrowUp') { ev.preventDefault(); move(-1); }
    else if (k === 'l' || k === 'ArrowRight' || k === 'Enter') { ev.preventDefault(); open(); }
    else if (k === 'h' || k === 'ArrowLeft' || k === 'Backspace') { ev.preventDefault(); folderUp(); }
    else if (k === '/') { ev.preventDefault(); S.focusId = 'ff'; render(); }
    return;
  }
  if (k === 'Escape') { S.fpane = 'list'; return render(); }
  if (k === 'j' || k === 'k') return move(k === 'j' ? 1 : -1);
  if (k === 'h') { S.fpane = 'list'; return folderUp(); }
  if ((k === 'l' || k === 'Enter') && e?.dir) return enterFolder(e.path);
  readerScroll(ev);
}

function activityKey(ev, typing) {

function settingsKey(ev, typing) {

// ---------- shell ----------
function topbar() {

}

function copyChip() {

}

}

}

// ---------- command palette (⌘K) ----------
function commands() {
  const t = docTarget(), out = [];
  if (t && !t.dir) out.push(
    { label: 'Read', note: t.name, sc: '↵', run: () => readDoc(t) },
    { label: 'Open in editor', sc: '⌘↵', run: () => editor(t) },
    { label: 'Show in Folders', sc: '⇥', run: () => revealInFolders(t) },
    { label: 'Copy path', run: () => { try { navigator.clipboard.writeText(t.path).catch(() => {}); } catch {} toast(`Copied ${t.path}`); } },
    { label: 'Copy to…', step: 'copy' },
    { label: 'Move to…', step: 'move' },
    { label: 'Send with AirDrop…', run: () => { S.lastDoc = t.path; go('transfers'); } },
  );
  for (const id of ORDER) out.push({ label: `Go to ${SECTIONS[id].label}`, icon: SECTIONS[id].icon, sc: SECTIONS[id].sc, run: () => go(id) });
  for (const th of THEMES) out.push({ label: `Theme: ${th.name}`, note: th.sub, run: () => setTheme(th.id) });
  return out;
}
function paletteItems() {
  const P = S.palette, q = P.query.trim().toLowerCase();
  if (!P.step) return commands().filter(c => !q || fuzzy(q, c.label));
  const here = parentOf(P.t.path);
  return FOLDERS.filter(f => f.path !== here)
    .map(f => ({ f, m: q ? fuzzy(q, f.path) : { score: 0 } })).filter(x => x.m)
    .sort((a, b) => b.m.score - a.m.score).slice(0, 40)
    .map(({ f }) => ({ label: f.path, icon: 'folder', run: () => finishTransfer(P.step, P.t, f.path) }));
}
function paletteHTML() {
  const P = S.palette, items = paletteItems();
  P.sel = clamp(P.sel, items.length);
  const title = P.step ? `${P.step === 'copy' ? 'Copy' : 'Move'} ${esc(P.t.name)} to…` : 'Commands';
  return `<div class="scrim" data-act="palette-close"></div><div class="palette"><div class="ptitle">${ptText(title)}</div><div class="pf"><div class="field">${ic('search')}<input id="pq" value="${esc(P.query)}" placeholder="${P.step ? 'Type a folder' : 'Type a command, a section or a theme'}" autocomplete="off" spellcheck="false"></div></div>
    <div class="pal-list">${items.map((it, i) => `<div class="pal-row ${i === P.sel ? 'sel' : ''}" data-act="pal-row" data-i="${i}">${it.icon ? ic(it.icon) : ''}<span>${esc(it.label)}</span>${it.note ? `<span class="note">${esc(it.note)}</span>` : ''}<span class="sc">${esc(it.sc ?? '')}</span></div>`).join('') || '<div class="empty">Nothing matches.</div>'}</div></div>`;
}
function openPalette() { S.palette = { step: null, query: '', sel: 0 }; S.engaged = true; render(); }
function runPaletteItem(it) {
  if (!it) return;
  if (it.step) { S.palette = { step: it.step, query: '', sel: 0, t: docTarget() }; return render(); }
  S.palette = null;
  it.run();
  render();
}
function finishTransfer(step, t, dest) {
  const vol = p => p.startsWith('/Volumes/') ? p.split('/').slice(0, 3).join('/') : '~';
  if (step === 'copy') toast(`Prototype: would copy ${t.name} to ${dest}. Existing names are skipped, never replaced.`);
  else if (vol(t.path) === vol(dest)) toast(`Prototype: would move ${t.name} to ${dest}, a rename on the same disk.`);
  else toast('Moving to another disk means copying and then deleting. That comes in a later phase.');
}

// ---------- actions ----------
function go(id, { focus = false } = {}) {

}
function openFolder(path) { Object.assign(S, { folder: path, fsel: 0, ffilter: '', fpane: 'list' }); go('folders'); }
function enterFolder(path) { Object.assign(S, { folder: path, fsel: 0, ffilter: '' }); render(); }
function folderUp() {
  const from = S.folder, p = parentOf(from);

  S.folder = p;
  S.fsel = Math.max(0, folderList().findIndex(it => it.e.path === from));
  render();
}
function revealInFolders(e) {
  Object.assign(S, { folder: e.dir ? e.path : parentOf(e.path), ffilter: '', fpane: 'list' });
  S.fsel = Math.max(0, folderList().findIndex(it => it.e.path === e.path));
  go('folders');
}
function readDoc(t) {
  if (S.section === 'folders') { S.fpane = 'doc'; return; }
  const i = searchList().findIndex(it => it.e.path === t.path);
  if (S.section === 'search' && i >= 0) { S.sel = i; S.spane = 'doc'; S.focusId = null; return; }
  revealInFolders(t); S.fpane = 'doc';
}
function editor(e) {
  if (!e || e.dir) return;
  toast(`Would open ${e.name} in ${['md', 'code', 'txt'].includes(e.kind) ? S.editor : 'its default app'}.`);
}
function sendAirDrop() {
  const dev = DEVICES[S.dsel], doc = ENTRY.get(S.lastDoc);
  if (!doc || dev.asleep || S.vis === 'Receiving off') return;
  XFERS.unshift({ icon: 'airdrop', tone: '', title: 'Handed to AirDrop', sub: `${doc.name} to ${dev.name}. macOS does not confirm delivery.`, when: 'Just now' });
  S.tpane = 'xfers';
  toast(`Prototype: would hand ${doc.name} to AirDrop for ${dev.name}.`);
  render();
}
function setTheme(id) {
  const t = THEMES.find(x => x.id === id);
  S.theme = id;
  const root = document.documentElement;
  root.dataset.theme = t.id;
  root.dataset.family = t.family;
  root.toggleAttribute('data-dark', t.dark);
}
function zoom(d) { S.zoom = d === 0 ? 100 : Math.min(200, Math.max(70, S.zoom + d)); render(); }
function readerScroll(ev) {
  const el = app.querySelector('[data-scroll="doc"]');
  if (!el) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); el.scrollBy(0, ev.key === 'ArrowDown' ? 64 : -64); }
  else if (ev.key === ' ') { ev.preventDefault(); el.scrollBy(0, (ev.shiftKey ? -1 : 1) * el.clientHeight * 0.85); }
}
function openMenu(btn, items, pick) {
  const fr = app.getBoundingClientRect(), r = btn.getBoundingClientRect();
  S.menu = { x: Math.max(4, Math.min(r.left - fr.left, fr.width - 240)), y: r.bottom - fr.top + 4, items, pick };
  render();
}
function toast(msg) {
  let box = app.querySelector('.toasts');
  if (!box) { box = document.createElement('div'); box.className = 'toasts'; app.appendChild(box); }
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ---------- render ----------
const app = document.getElementById('app');
function keepVisible(row) {
  const box = row.closest('[data-scroll]');
  const top = row.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop, bottom = top + row.offsetHeight;
  const head = box.querySelector('thead')?.offsetHeight ?? 0;
  if (top - head < box.scrollTop) box.scrollTop = top - head - 4;
  else if (bottom > box.scrollTop + box.clientHeight) box.scrollTop = bottom - box.clientHeight + 4;
}
function onDocScroll(el) {
  const max = el.scrollHeight - el.clientHeight;
  const prog = app.querySelector('#prog');
  if (prog) prog.style.width = (max > 0 ? el.scrollTop / max * 100 : 0) + '%';
  const ind = app.querySelector('#pageind');
  if (!ind) return;
  const y = el.scrollTop + el.clientHeight * 0.3;
  let page = 1;
  for (const p of el.querySelectorAll('.page')) { if (p.offsetTop <= y) page = +p.dataset.page; else break; }
  ind.textContent = `Page ${page} of ${ind.dataset.total}`;
}
function render() {
  const saved = {};
  for (const el of app.querySelectorAll('[data-scroll]')) saved[el.dataset.scroll + '|' + el.dataset.key] = el.scrollTop;
  const active = document.activeElement;
  const caret = active instanceof HTMLInputElement && app.contains(active) ? active.selectionStart : null;
  const toasts = app.querySelector('.toasts');
  if (S.section === 'search') S.sel = clamp(S.sel, searchList().length);
  if (S.section === 'folders') S.fsel = clamp(S.fsel, folderList().length);
  const t = docTarget();
  if (t && !t.dir && (S.section === 'search' || S.section === 'folders')) S.lastDoc = t.path;
  const v = SECTIONS[S.section].view();
  app.innerHTML = `${S.nav === 'top' ? topbar() : ''}<div class="body">${S.nav === 'side' ? sidebar() : ''}<div class="main"><div class="toolbar">${v.toolbar}</div><div class="work">${v.work}</div></div></div>${status(v.status)}${S.menu ? menuHTML() : ''}${S.palette ? paletteHTML() : ''}`;
  if (toasts) app.appendChild(toasts);
  for (const el of app.querySelectorAll('[data-scroll]')) {
    const key = el.dataset.scroll + '|' + el.dataset.key;
    if (key in saved) el.scrollTop = saved[key];
  }
  for (const row of app.querySelectorAll('.row.sel, tr.sel, .dev.sel')) keepVisible(row);
  const doc = app.querySelector('[data-scroll="doc"]');
  if (doc) { doc.onscroll = () => onDocScroll(doc); onDocScroll(doc); }
  const want = S.palette ? 'pq' : S.focusId;
  const input = want && S.engaged ? document.getElementById(want) : null;
  if (input) {
    input.focus({ preventScroll: true });
    if (S.selectAll) { input.select(); S.selectAll = false; }
    else { const c = Math.min(caret ?? input.value.length, input.value.length); input.setSelectionRange(c, c); }
  } else if (app.contains(document.activeElement)) document.activeElement.blur();
  renderBar();
}
// Live updates patch their own elements so typing and scrolling are never interrupted.
function renderWork() {
  const work = app.querySelector('.work');
  if (!work) return;
  const saved = {};
  for (const el of work.querySelectorAll('[data-scroll]')) saved[el.dataset.scroll] = el.scrollTop;
  work.innerHTML = SECTIONS[S.section].view().work;
  for (const el of work.querySelectorAll('[data-scroll]')) if (el.dataset.scroll in saved) el.scrollTop = saved[el.dataset.scroll];
}

// ---------- events ----------
document.addEventListener('pointerdown', () => { S.engaged = true; }, true);
app.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');

  const act = a.dataset.act, i = +a.dataset.i, v = a.dataset.v;
  switch (act) {
    case 'go': return go(v);
    case 'place': return openFolder(v);
    case 'eject': ev.stopPropagation(); return toast('Prototype: would eject Samsung T7. Crawler never forces an unmount.');
    case 'palette': return openPalette();
    case 'palette-close': S.palette = null; break;
    case 'pal-row': S.palette.sel = i; return runPaletteItem(paletteItems()[i]);
    case 'menu-close': S.menu = null; break;
    case 'menu-pick': { const m = S.menu; S.menu = null; m.pick(m.items[i]); break; }
    case 'row':
      if (S.section === 'search') { S.sel = i; S.spane = 'list'; }
      else { S.fsel = i; S.fpane = 'list'; S.focusId = null; }
      break;
    case 'scope-menu':
      return openMenu(a, [{ label: 'This Mac', icon: 'search', path: null }, ...PLACES.map(p => ({ label: p.label, icon: p.icon, note: p.note, path: p.path })), { label: `$ ${baseName(S.folder)}`, icon: 'folder', note: 'current folder', path: S.folder, local: true }]
        .map(it => ({ ...it, cur: it.path === S.scope && !!it.local === S.local })), it => Object.assign(S, { scope: it.path, local: !!it.local, sel: 0, focusId: 'q' }));
    case 'scope-path': Object.assign(S, { scope: a.dataset.path, local: false, query: '', sel: 0 }); break;
    case 'folder-path': enterFolder(a.dataset.path); return;
    case 'kind': S.kind = v; S.sel = 0; break;
    case 'place-seg': break;
    case 'place': return openFolder(v);
    case 'zoom': return zoom(+a.dataset.d);
    case 'editor': return editor(docTarget());
    case 'toggle-list': S.listOpen = !S.listOpen; break;
    case 'sort': S.asort = v; break;
    case 'proc': S.aselName = v; break;
    case 'pause': S.paused = !S.paused; break;
    case 'quit': return toast(`Prototype: would ask ${S.aselName} to quit.`);
    case 'device': S.dsel = i; S.tpane = 'devices'; break;
    case 'send': return sendAirDrop();
    case 'cancel-copy': COPY.state = 'cancelled'; toast(`Cancelled the copy to ${COPY.dest}.`); break;
    case 'vis-menu': return openMenu(a, ['Contacts only', 'Everyone for 10 minutes', 'Receiving off'].map(x => ({ label: x, cur: x === S.vis })), it => { S.vis = it.label; });
    case 'editor-menu': return openMenu(a, ['Zed', 'Visual Studio Code', 'BBEdit', 'TextEdit'].map(x => ({ label: x, cur: x === S.editor })), it => { S.editor = it.label; });
    case 'group': S.group = v; break;
    case 'theme': setTheme(v); break;
    case 'colw': S.colw = v; break;
    case 'toggle': S[a.dataset.k] = !S[a.dataset.k]; break;

// Clicking a pane makes it the active one; its title strip shows where the keyboard goes.
app.addEventListener('mousedown', ev => {
  const p = ev.target.closest('[data-pane]');
  if (!p || ev.target.closest('input')) return;
  const id = p.dataset.pane;
  if (S.section === 'search' && (id === 'list' || id === 'doc') && S.spane !== id) { S.spane = id; S.focusId = id === 'list' ? 'q' : null; queueMicrotask(render); }
  if (S.section === 'folders' && (id === 'list' || id === 'doc') && S.fpane !== id) { S.fpane = id; S.focusId = null; queueMicrotask(render); }
  if (S.section === 'transfers' && (id === 'devices' || id === 'xfers') && S.tpane !== id) { S.tpane = id; queueMicrotask(render); }
});
app.addEventListener('dblclick', ev => {
  const r = ev.target.closest('[data-act="row"]');
  if (!r) return;
  const L = S.section === 'search' ? searchList() : folderList(), e = L[+r.dataset.i]?.e;
  if (!e) return;
  if (e.dir) return S.section === 'search' ? openFolder(e.path) : enterFolder(e.path);
  if (S.section === 'search') S.spane = 'doc'; else S.fpane = 'doc';
  S.focusId = null;
  render();
});
app.addEventListener('input', ev => {
  const id = ev.target.id, val = ev.target.value;
  if (id === 'q') {

    if (q.startsWith('$')) { q = q.slice(1); Object.assign(S, { scope: S.folder, local: true }); }
    if (!q && S.local && !val.startsWith('$')) Object.assign(S, { scope: null, local: false }); // clearing a $ search restores This Mac
    Object.assign(S, { query: q, sel: 0, spane: 'list' });

app.addEventListener('focusin', ev => {
  const id = ev.target.id;

});
document.addEventListener('keydown', ev => {

  if (ev.metaKey && (k.toLowerCase() === 'k' || (ev.shiftKey && k.toLowerCase() === 'p'))) { ev.preventDefault(); return openPalette(); }
  if (ev.metaKey && k.toLowerCase() === 'p') { ev.preventDefault(); return go('search', { focus: true }); }
  if (ev.metaKey && k === '\\') { ev.preventDefault(); S.listOpen = !S.listOpen; return render(); }
  if (ev.metaKey && (k === '=' || k === '+')) { ev.preventDefault(); return zoom(10); }
  if (ev.metaKey && k === '-') { ev.preventDefault(); return zoom(-10); }
  if (ev.metaKey && k === '0') { ev.preventDefault(); return zoom(0); }
  if (ev.metaKey && k.toLowerCase() === 'f') { ev.preventDefault(); return toast('Find in the document is not part of this prototype.'); }
  SECTIONS[S.section].key(ev, ev.target instanceof HTMLInputElement);
});

// ---------- simulation ----------
setInterval(() => {
  if (COPY.state !== 'running') return;
  COPY.done = Math.min(COPY.total, COPY.done + 0.012);
  if (COPY.done >= COPY.total) { COPY.state = 'done'; toast(`Copied ${COPY.items} items to ${COPY.dest}.`); return render(); }
  const pct = COPY.done / COPY.total * 100;
  const chip = app.querySelector('#st-copy');
  if (chip) { chip.querySelector('.bar > i').style.width = pct + '%'; chip.querySelector('.num').textContent = `${pct.toFixed(0)} %`; }
  const row = app.querySelector('#x-copy');
  if (row) row.outerHTML = copyRow();
}, 500);
setInterval(() => {
  if (S.paused) return;
  for (const p of PROCS) {
    p.cpu = Math.max(0, p.base + (rnd() - 0.5) * Math.max(0.4, p.base * 0.6));
    p.mem = Math.max(40, p.mem + (rnd() - 0.48) * p.mem * 0.01);
    if (p.disk) p.disk = Math.max(0, p.disk + (rnd() - 0.5) * 0.6);
    p.hist.push(p.cpu); p.hist.shift();
  }
  if (S.section !== 'activity' || S.menu || S.palette) return;
  renderWork();
  const m = app.querySelector('#meters');
  if (m) m.innerHTML = metersHTML();
}, 1000);

// ---------- prototype chrome ----------
const HELP = {
  top: { title: 'Navegación arriba', idea: 'Las cinco secciones van en la barra de título, como pestañas fijas. El ancho queda para leer.' },
  side: { title: 'Navegación lateral', idea: 'Las secciones y los lugares van en una barra lateral, como Finder. Más visible, pero quita ancho al lector.' },
};
const KEYS = [['⌘1–4 ⌘,', 'secciones (en el navegador, ⌃1–4)'], ['⌘K', 'comandos: acciones, secciones y temas'], ['⌘P', 'buscar desde cualquier sección'],
  ['↵ / Esc', 'pasar al lector y volver a la lista'], ['j k', 'documento siguiente o anterior'], ['h l', 'subir o entrar en carpetas (Folders)'],
  ['⇥', 'ver el fichero en Folders'], ['$', 'buscar en la carpeta actual'], ['⌘\\', 'ocultar la lista'], ['⌥N ⌥T', 'cambiar navegación y tema']];
const pbar = document.getElementById('protobar'), help = document.getElementById('help');
function renderBar() {
  pbar.innerHTML = `<div class="pb-pill"><span class="pb-lab">Navegación</span><button data-pb="nav" data-v="top" class="${S.nav === 'top' ? 'on' : ''}">Arriba</button><button data-pb="nav" data-v="side" class="${S.nav === 'side' ? 'on' : ''}">Lateral</button></div>
    <div class="pb-pill"><span class="pb-lab">Tema</span><select data-pb="theme" aria-label="Tema">${THEMES.map(t => `<option value="${t.id}" ${t.id === S.theme ? 'selected' : ''}>${esc(t.name)}${t.family.startsWith('retro') ? ' (retro)' : ''}</option>`).join('')}</select></div>
    <button data-pb="help" class="${S.help ? 'on' : ''}" title="Idea y teclas">?</button>
    <code class="pb-state">sección=${S.section} · panel=${{ search: S.spane, folders: S.fpane, transfers: S.tpane }[S.section] ?? '—'} · consulta="${esc(S.query)}" · ámbito=${esc(scopeLabel())}</code>`;
  help.hidden = !S.help;
  if (S.help) {
    const H = HELP[S.nav];
    help.innerHTML = `<button class="x" data-pb="help" title="Cerrar">×</button><h4>${H.title}</h4><p>${H.idea} El título del panel activo indica dónde va el teclado. La barra de estado muestra las copias en curso desde cualquier sección.</p><dl>${KEYS.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl><p class="foot">Datos simulados: nada toca el disco.</p>`;
  }
  try {
    const u = new URL(location.href);
    u.searchParams.set('nav', S.nav);
    u.searchParams.set('theme', S.theme);
    history.replaceState(null, '', u);
  } catch {}
}
function onBar(ev) {
  const b = ev.target.closest('[data-pb]');
  if (!b || b.tagName === 'SELECT') return;
  if (b.dataset.pb === 'nav') { S.nav = b.dataset.v; render(); }
  else if (b.dataset.pb === 'help') { S.help = !S.help; renderBar(); }
}
pbar.addEventListener('click', onBar);
help.addEventListener('click', onBar);
pbar.addEventListener('change', ev => { if (ev.target.dataset.pb === 'theme') { setTheme(ev.target.value); render(); } });

if (window.self === window.top && window.innerWidth >= 1000) {
  document.documentElement.classList.add('standalone');
  const fit = () => document.documentElement.style.setProperty('--stage-h', innerHeight + 'px');
  fit();
  addEventListener('resize', fit);
  S.engaged = true;
}
setTheme(S.theme);
render();
</script>
</body>
</html>
